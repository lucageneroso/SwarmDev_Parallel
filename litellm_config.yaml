model_list:
  # === GRUPPO GPT-4o-2024-08-06 (Modello esatto richiesto da Parlant) ===
  - model_name: gpt-4o-2024-08-06
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # === GRUPPO GPT-4o (Generico) ===
  - model_name: gpt-4o
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # === GRUPPO GPT-4 e GPT-4.1 (Catch-all per CannedResponseGenerator) ===
  - model_name: gpt-4.1
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gpt-4
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # === GRUPPO GPT-3.5-TURBO ===
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # === GRUPPO EMBEDDINGS (Per il Glossary di Parlant) ===
  - model_name: text-embedding-3-small
    litellm_params:
      model: text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY_FALLBACK
  - model_name: text-embedding-3-large
    litellm_params:
      model: text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY_FALLBACK
  - model_name: text-embedding-ada-002
    litellm_params:
      model: text-embedding-ada-002
      api_key: os.environ/OPENAI_API_KEY_FALLBACK

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
