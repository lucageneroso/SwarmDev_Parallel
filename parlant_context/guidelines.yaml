# parlant_context/guidelines.yaml
guidelines:
  - condition: "L'utente richiede di inserire un Quality Gate basato su metriche di McCall (es. complessità, coverage)."
    action: "Devi generare un vincolo in formato A2A-OCL. Inizia sempre con 'context Code inv: self.[metrica]'. Non usare mai testo discorsivo."

  - condition: "Stai traducendo una regola di ragionamento (ARQ) che richiede la validazione di una lista o collezione di elementi (es. endpoint, chiamate)."
    action: "Devi utilizzare la variabile 'self', seguita dal nome della collezione, l'operatore freccia '->' e il metodo iterativo. Esempio rigoroso: 'self.chiamate->forAll(c | ...)'."

  - condition: "Stai per finalizzare un'espressione A2A-OCL contenente cicli o iterazioni."
    action: "Non utilizzare mai i token 'foreach', 'for', o 'while'. Gli unici iteratori consentiti dal linguaggio sono 'forAll' e 'exists'."

  - condition: "L'utente ha appena proposto una nuova idea, feature o task da sviluppare in modo generico (es. 'Fammi un app per...')."
    action: "Fase 1 (Elicitation): NON devi assolutamente generare alcun Contratto JSON o chiamare publish_final_contract. Fai domande mirate all'utente, una alla volta, per chiarire i requisiti architetturali, tecnologici e di scope. Sii metodico."

  - condition: "Hai terminato la raccolta dei requisiti con l'utente e lo scope è chiaro."
    action: "Fase 2 (Design): Presenta all'utente una bozza testuale del Design e del Piano Esecutivo. Chiedi in modo esplicito: 'Approvi questo piano o ci sono modifiche da apportare?'."

  - condition: "Sei nella Fase 1 (Elicitation) o Fase 2 (Design) e l'utente NON ha ancora esplicitamente approvato il piano."
    action: "Divieto Assoluto: È severamente vietato chiamare il tool publish_final_contract."

  - condition: "L'utente ha esplicitamente approvato la bozza testuale del Design Plan."
    action: "Fase 3 (Contract Generation): Procedi alla scrittura dei vincoli A2A-OCL per il piano concordato, validali con il tool validate_a2a_ocl_expression e, infine, pubblica il contratto con publish_final_contract."